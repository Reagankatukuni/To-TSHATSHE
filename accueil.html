<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-TSHATSHE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🇨🇩 To-TSHATSHE</h1>
    <p>Connectons-nous</p>
</header>

<div class="container">

    <div class="publication">
        <h3>Créer une publication</h3>
        <textarea id="texte" placeholder="Quoi de neuf ?"></textarea>
        <button onclick="publier()">Publier</button>
    </div>

    <div id="publications">
        <div class="publication">
            <h3>Bienvenue sur To-TSHATSHE ! 🇨🇩</h3>
            <p>Notre plateforme de communication et de partage commence ici.</p>
        </div>
    </div>

</div>

<div class="navigation">
    <span>🏠 Accueil</span>
    <span>🔍 Recherche</span>
    <span>➕ Publier</span>
    <span>👤 Profil</span>
</div>

<script>
function publier() {
    const texte = document.getElementById("texte").value;

    if (texte.trim() === "") {
        alert("Écrivez quelque chose avant de publier !");
        return;
    }

    const publication = document.createElement("div");
    publication.className = "publication";

    const contenu = document.createElement("p");
    contenu.textContent = texte;

    const date = document.createElement("small");
    date.textContent = "À l'instant";

    publication.appendChild(contenu);
    publication.appendChild(date);

    document.getElementById("publications").prepend(publication);
    document.getElementById("texte").value = "";
}
</script>

</body>
</html>
